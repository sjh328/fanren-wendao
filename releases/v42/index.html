<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="凡人问道 —— 网页版文字修仙游戏">
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f0df">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="凡人问道">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>凡人问道 · 文字修仙</title>
<link rel="stylesheet" href="style.css?v=58">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body>
<div id="app">

  <!-- ==================== 开始 / 存档界面 ==================== -->
  <div id="start-screen" class="screen">
    <div class="start-inner">
      <div class="title-wrap">
        <h1 class="game-title">凡人问道</h1>
        <div class="title-seal">道</div>
        <p class="game-subtitle">众生如蝼蚁 · 大道三千 · 我命由我不由天</p>
      </div>

      <!-- 存档位选择 -->
      <div id="start-slots" class="start-slots"></div>
      <p class="start-tip">选择一处存档位，开启你的仙途。</p>
      <div class="create-btns" style="margin-top:10px"><button class="btn btn-sm" data-action="st-mirror">🪞 轮 回 镜</button><button class="btn btn-sm" data-action="st-bak2" title="回捞上次会话开始前的自动存档快照">♻ 回捞上次快照</button></div>
    </div>

    <!-- 创角界面 -->
    <div id="create-screen" class="hidden">
      <div class="create-inner">
        <h2 class="create-title">初入道途 · 天资注定</h2>
        <div class="create-row name-row">
          <label for="create-name">道&nbsp;号</label>
          <input id="create-name" type="text" maxlength="6" placeholder="请输入道号（至多六字）">
        </div>
        <div id="create-attrs" class="create-attrs"></div>
        <div id="create-rating" class="create-rating"></div>
        <div class="create-btns">
          <button class="btn" data-action="st-back">返 回</button>
          <button class="btn" data-action="st-reroll">✦ 重塑天资</button>
          <button class="btn btn-primary" data-action="st-start">踏上仙途</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 游戏主界面 ==================== -->
  <div id="game-screen" class="screen hidden">
    <header id="top-bar">
      <div class="top-title">凡人问道</div>
      <div class="top-right">
        <!-- v22 移动端抽屉入口（桌面隐藏）；v28 图标化（.mdb-t 字样窄屏收起） -->
        <button class="m-drawer-btn" data-action="act-drawer" data-panel="left" aria-label="打开道途面板"><i class="mdb-i" aria-hidden="true">☰</i><span class="mdb-t">道途</span></button>
        <button class="m-drawer-btn" data-action="act-drawer" data-panel="right" aria-label="打开乾坤袋"><i class="mdb-i" aria-hidden="true">🎒</i><span class="mdb-t">乾坤</span></button>
        <div id="amb-ctrl">
          <button class="amb-btn" id="amb-toggle" data-action="amb-panel" title="设置"><i class="mdb-i" aria-hidden="true">⚙</i><span class="mdb-t"> 设置</span></button>
          <div id="amb-panel" class="amb-panel hidden">
            <div class="amb-panel-title">— 设 置 —</div>
            <label class="opt-line"><input type="checkbox" id="amb-sfx"> 事件音效（突破 / 稀有 / 胜利）</label>
            <label class="opt-line"><input type="checkbox" id="amb-music"> 古琴背景乐（音量 20%）</label>
            <div class="amb-vol-row">总音量 <input type="range" id="amb-vol" min="0" max="100" value="80"></div>
            <div class="amb-vol-row">界面字号
              <select id="amb-font">
                <option value="100">标准</option>
                <option value="110">大</option>
                <option value="122">特大</option>
              </select>
            </div>
            <div class="amb-vol-row">界面密度
              <select id="amb-density">
                <option value="cozy">舒适</option>
                <option value="compact">紧凑（内容 +15%）</option>
              </select>
            </div>
            <div class="amb-vol-row">战斗速度
              <select id="amb-speed">
                <option value="1">×1 原速</option>
                <option value="2">×2 两倍</option>
                <option value="3">极速</option>
              </select>
            </div>
            <div class="amb-vol-row">挂机节奏
              <select id="amb-apace">
                <option value="fast">快（80ms/轮）</option>
                <option value="normal">常（280ms/轮）</option>
                <option value="slow">缓（600ms/轮）</option>
              </select>
            </div>
            <label class="opt-line"><input type="checkbox" id="amb-anim"> 数字滚动与浮动战斗数字</label>
            <label class="opt-line"><input type="checkbox" id="amb-tw"> 剧情逐字演出（打字机效果）</label>
            <div class="amb-vol-row">日志密度
              <select id="amb-logdens">
                <option value="all">全量</option>
                <option value="lite">精简（略去杂记）</option>
              </select>
            </div>
            <div class="amb-vol-row">聚灵偏好
              <select id="amb-rush">
                <option value="ask">每次询问</option>
                <option value="always">总是聚灵</option>
                <option value="skip">从不聚灵</option>
              </select>
            </div>
            <div class="amb-vol-row">行权小账
              <select id="amb-damode">
                <option value="ask">每次弹出</option>
                <option value="always">toast 汇总</option>
                <option value="skip">静默</option>
              </select>
            </div>
            <div class="amb-vol-row">行权悟道
              <select id="amb-wudao">
                <option value="ask">每次询问</option>
                <option value="always">纯度 ≥30% 自动</option>
                <option value="skip">跳过悟道</option>
              </select>
            </div>
            <div class="amb-vol-row">挂机方式
              <select id="amb-engine">
                <option value="smart">智能（灵石充裕自动闭关）</option>
                <option value="normal">普通（不自动闭关）</option>
              </select>
            </div>
            <div class="tip-line" style="margin:4px 0 0">· 自动战斗可在战斗中一键开启（残血自动服药、敌蓄力自动防御）。</div>
            <div class="tip-line" style="margin:4px 0 0">· 快捷键：剧情中 <b>Enter/空格</b> 翻页；战斗中 <b>1~5</b> 普攻/法诀/防御/道具/遁走；<b>ESC</b> 依次关层。</div>
          </div>
        </div>
        <div id="top-info" class="top-info"></div>
      </div>
    </header>

    <main id="layout">
      <!-- 左：角色状态 -->
      <aside id="panel-left" class="panel"></aside>

      <!-- 中：操作 + 日志 -->
      <section id="panel-center" class="panel center-panel">
        <div id="focus-strip" class="hidden"></div>
      <nav id="tabs"></nav>
        <div id="tab-content"></div>
        <div id="log-wrap" class="collapsed">
          <div class="log-head">✦ 游历记载<span class="log-badge" style="display:none"></span>
            <span class="log-tools">
              <span class="log-filters">
                <button class="log-tool on" data-action="log-filter" data-tf="">全部</button>
                <button class="log-tool" data-action="log-filter" data-tf="battle">战斗</button>
                <button class="log-tool" data-action="log-filter" data-tf="gain">收获</button>
                <button class="log-tool" data-action="log-filter" data-tf="loss">损失</button>
                <button class="log-tool" data-action="log-filter" data-tf="story">剧情</button>
                <button class="log-tool" data-action="log-filter" data-tf="flavor">见闻</button>
                <button class="log-tool" data-action="log-filter" data-tf="system">系统</button>
              </span>
              <button class="log-toggle" data-action="log-toggle" title="展开 / 收起游历记载">展开</button>
              <button class="log-tool" id="log-pause-btn" data-action="log-pause">暂停滚动</button>
              <button class="log-tool" data-action="log-clear">一键清空</button>
            </span>
          </div>
          <div id="log"></div>
        </div>
      </section>

      <!-- 右：背包 + 菜单 -->
      <aside id="panel-right">
        <div class="panel" id="bag-panel"></div>
        <div class="panel menu-panel">
          <div class="panel-title">✦ 菜单</div>
          <div class="menu-btns">
            <div class="menu-group">
              <div class="menu-group-label">记档</div>
              <div class="menu-group-btns">
                <button class="btn btn-sm" data-action="act-codex">成就 · 图鉴</button>
                <button class="btn btn-sm" data-action="act-figures">👤 人物志</button>
                <button class="btn btn-sm" data-action="act-battle-review">⚔ 战斗回顾</button>
                <button class="btn btn-sm" data-action="act-career">📜 生涯</button>
              </div>
            </div>
            <div class="menu-group">
              <div class="menu-group-label">系统</div>
              <div class="menu-group-btns">
                <button class="btn btn-sm" data-action="act-save-open">存档 / 读档</button>
                <button class="btn btn-sm" data-action="act-help">玩法说明</button>
                <button class="btn btn-sm btn-danger" data-action="act-newgame">回到开始界面</button>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </main>

    <!-- v28 修瑕：遮罩原挂 #app 层（z70），被 #game-screen 的 z-index:1 层叠上下文整体压住——
         抽屉开了却被遮罩盖住变暗且点哪都是遮罩。移入 #game-screen 内与抽屉同域（遮罩70 < 抽屉80）。 -->
    <div id="drawer-backdrop" data-action="act-drawer-close" aria-hidden="true"></div>

    <!-- v28 移动端「更多」底部面板：四大页签 + 十处直达（≤860px 显示） -->
    <div id="more-sheet" class="hidden" role="dialog" aria-modal="true" aria-label="更多去处"></div>
  </div>

  <!-- ==================== 战斗弹窗 ==================== -->
  <div id="battle-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="战斗">
    <div class="battle-box" id="battle-box"></div>
  </div>

  <!-- ==================== 通用弹窗 ==================== -->
  <div id="popup-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="对话框">   <!-- v33（E101）：静态补齐 role/aria（原仅 popup() 打开时动态补，打开前一瞬缺失） -->
    <div class="popup-box">
      <button class="popup-x" data-action="pop-choice" data-i="-1" title="关闭" aria-label="关闭弹窗">✕</button>
      <div class="popup-title" id="popup-title"></div>
      <div class="popup-body" id="popup-body"></div>
      <div class="popup-btns" id="popup-btns"></div>
    </div>
  </div>

  <!-- ==================== 大道选择（§19） ==================== -->
  <div id="dao-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="叩问大道">
    <div class="popup-box dao-box">
      <div class="popup-title">叩 问 大 道</div>
      <div class="card-desc" style="text-align:center;margin-bottom:12px;color:var(--text-dim)">道途六条，殊途同归。一念既定，终身不悔。</div>
      <div class="dao-grid" id="dao-box"></div>
    </div>
  </div>

  <!-- ==================== 天劫渡劫（§22） ==================== -->
  <div id="tribulation-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="天劫">
    <div class="popup-box trib-box" id="trib-box"></div>
  </div>

  <!-- ==================== 新手引导 ==================== -->
  <div id="tutorial" class="modal hidden" role="dialog" aria-modal="true" aria-label="新手引导">   <!-- v33（E95）：v32 G5 漏网——tutorial 弹层补 aria 三属性 -->
    <div class="tutorial-box">
      <div class="tutorial-step" id="tutorial-step"></div>
      <div class="tutorial-dots" id="tutorial-dots"></div>
      <div class="tutorial-btns">
        <button class="btn btn-sm" data-action="tut-skip">跳过引导</button>
        <button class="btn btn-sm" data-action="tut-prev">上一步</button>
        <button class="btn btn-sm btn-primary" data-action="tut-next">下一步</button>
      </div>
    </div>
  </div>

  <button id="back-top" title="回到顶部" aria-label="回到顶部">▲</button>

  <div id="toast"></div>
  <div id="announce"></div>
</div>
<script src="game.js?v=58"></script>
</body>
</html>
